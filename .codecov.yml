codecov:
  notify:
    # both unit-test jobs run under the same condition, so coverage always
    # arrives as two uploads; do not evaluate statuses until both are in,
    # or a report codecov received but failed to process leaves the project
    # status comparing the Windows flag alone against base (~-10%)
    after_n_builds: 2
comment:
  after_n_builds: 2
ignore:
- "**/*.pb.go"
- "**/*.pb.gw.go"
- "**/*generated.go"
- "**/*generated.deepcopy.go"
- "**/*_test.go"
- "pkg/apis/client/.*"
- "pkg/client/.*"
- "vendor/.*"
flags:
  unit-tests:
    carryforward: true
  unit-tests-windows:
    carryforward: true
coverage:
  status:
    # we've found this not to be useful
    patch: off
    project:
      default:
        # allow test coverage to drop by 2%, assume that it's typically due to CI problems
        threshold: 2