codecov:
  # GitHub's default branch; Codecov still had the pre-rename master
  branch: main
  notify:
    # both unit-test jobs run under the same condition, so coverage always
    # arrives as two uploads; do not evaluate statuses until both are in, or
    # the project status compares the Windows flag alone against base
    after_n_builds: 2
comment:
  after_n_builds: 2
ignore:
- "**/*.pb.go"
- "**/*.pb.gw.go"
- "**/*generated.go"
- "**/*generated.deepcopy.go"
- "**/*_test.go"
# mockery output
- "**/mocks/**"
- "pkg/apis/client/.*"
- "pkg/client/.*"
- "vendor/.*"
# codegen and test tooling, not shipped code
- "hack/.*"
- "test/.*"
- "util/telemetry/builder/.*"
flags:
  unit-tests:
    carryforward: true
  unit-tests-windows:
    carryforward: true
coverage:
  status:
    # we've found this not to be useful
    patch: off
    project:
      default:
        # allow test coverage to drop by 2%, assume that it's typically due to CI problems
        threshold: 2