name: Renovate Config

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # a workaround to disable harden runner
  STEP_SECURITY_HARDEN_RUNNER: ${{ vars.disable_harden_runner }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        if: ${{ vars.disable_harden_runner != 'true' }}
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # renovate-config-validator silently accepts duplicate keys, but the hosted
      # app rejects the config and stops opening PRs (#17397).
      - name: Reject duplicate keys in renovate.json
        run: |
          python3 -I - renovate.json <<'EOF'
          import json, sys
          def hook(pairs):
              seen = set()
              for k, _ in pairs:
                  if k in seen:
                      sys.exit(f"duplicate key {k!r} in {sys.argv[1]}")
                  seen.add(k)
              return dict(pairs)
          json.load(open(sys.argv[1]), object_pairs_hook=hook)
          EOF
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # Unpinned on purpose: the hosted Renovate app runs the latest release, so
      # validate with the same version. --strict also fails when Renovate wants a
      # config migration (deprecated options), not just on invalid config.
      # --no-global validates it as repository config rather than global config.
      - name: Validate renovate.json
        run: npx --yes --package renovate -- renovate-config-validator --strict --no-global renovate.json
