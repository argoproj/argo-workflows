name: Dev Container

on:
  push:
    paths:
      - ".devcontainer/**"
      - "hack/k8s-versions.sh"
      - ".github/workflows/devcontainer.yaml"
    branches:
      - main
  pull_request:
    paths:
      - ".devcontainer/**"
      - "hack/k8s-versions.sh"
      - ".github/workflows/devcontainer.yaml"
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  # a workaround to disable harden runner
  STEP_SECURITY_HARDEN_RUNNER: ${{ vars.disable_harden_runner }}

jobs:
  build:
    runs-on: ubuntu-22.04
    if: github.repository == 'argoproj/argo-workflows'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        if: ${{ vars.disable_harden_runner != 'true' }}
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          # Workaround for segfaults under arm64:
          # https://github.com/docker/setup-qemu-action/issues/198#issuecomment-2653791775
          image: tonistiigi/binfmt:qemu-v7.0.0-28
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to registry
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAYIO_USERNAME }}
          password: ${{ secrets.QUAYIO_PASSWORD }}
      - name: Build dev container image
        run: make devcontainer-build
        env:
          TARGET_PLATFORM: linux/amd64,linux/arm64
          DEVCONTAINER_PUSH: ${{ github.event_name == 'push' && 'true' || 'false' }}
