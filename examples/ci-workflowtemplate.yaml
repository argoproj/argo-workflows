apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: ci
  annotations:
    workflows.argoproj.io/description: |
      This workflows builds and tests Argo Workflows.

      It demonstrates:

      * Cache restore and store.
      * Publishing test reports.
spec:
  arguments:
    parameters:
      - name: branch
        value: master

  entrypoint: main
  onExit: cache-store

  volumeClaimTemplates:
    - metadata:
        name: work
      spec:
        accessModes: [ ReadWriteOnce ]
        resources:
          requests:
            storage: 64Mi

  templates:
    - name: main
      dag:
        tasks:
          - name: cache-restore
            template: cache-restore
          - name: clone
            template: clone
          - name: deps
            template: deps
            dependencies:
              - clone
              - cache-restore
          - name: build
            template: build
            dependencies:
              - deps
          - name: test
            template: test
            dependencies:
              - build

    - name: cache-restore
      inputs:
        artifacts:
          - name: GOMODCACHE
            path: /mnt/GOMODCACHE
            optional: true
            s3:
              key: "github.com/golang/examples/{{workflow.parameters.branch}}/GOMODCACHE"
          - name: GOCACHE
            path: /mnt/GOCACHE
            optional: true
            s3:
              key: "github.com/golang/examples/{{workflow.parameters.branch}}/GOCACHE"
      container:
        volumeMounts:
          - mountPath: /go/pkg/mod
            name: work
            subPath: GOMODCACHE
          - mountPath: /root/.cache/go-build
            name: work
            subPath: GOCACHE
        image: golang:1.27.3
        workingDir: /go/src/github.com/golang/example
        command: [ sh, -euxc ]
        args:
          - |
            if [ -d /mnt/GOMODCACHE ]; then cp -R /mnt/GOMODCACHE/. "$(go env GOMODCACHE)"; fi
            if [ -d /mnt/GOCACHE ]; then cp -R /mnt/GOCACHE/. "$(go env GOCACHE)"; fi

    - name: cache-store
      container:
        volumeMounts:
          - mountPath: /go/pkg/mod
            name: work
            subPath: GOMODCACHE
          - mountPath: /root/.cache/go-build
            name: work
            subPath: GOCACHE
        image: golang:1.27.3
        command: [ sh, -euxc ]
        args:
          - |
            # Artifacts on a volume mount aren't saved, so copy the caches off the volume.
            mkdir -p /tmp/cache
            cp -R /go/pkg/mod /tmp/cache/GOMODCACHE
            cp -R /root/.cache/go-build /tmp/cache/GOCACHE
      outputs:
        artifacts:
          - name: GOMODCACHE
            path: /tmp/cache/GOMODCACHE
            optional: true
            s3:
              key: "github.com/golang/examples/{{workflow.parameters.branch}}/GOMODCACHE"
          - name: GOCACHE
            path: /tmp/cache/GOCACHE
            optional: true
            s3:
              key: "github.com/golang/examples/{{workflow.parameters.branch}}/GOCACHE"

    - name: clone
      container:
        volumeMounts:
          - mountPath: /go/src/github.com/golang/example
            name: work
            subPath: src
          - mountPath: /go/pkg/mod
            name: work
            subPath: GOMODCACHE
          - mountPath: /root/.cache/go-build
            name: work
            subPath: GOCACHE
        image: golang:1.27.3
        workingDir: /go/src/github.com/golang/example
        command: [ sh, -euxc ]
        args:
          - |
            git clone -v -b "{{workflow.parameters.branch}}" --single-branch --depth 1 https://github.com/golang/example.git .

    - name: deps
      container:
        image: golang:1.27.3
        volumeMounts:
          - mountPath: /go/src/github.com/golang/example
            name: work
            subPath: src
          - mountPath: /go/pkg/mod
            name: work
            subPath: GOMODCACHE
          - mountPath: /root/.cache/go-build
            name: work
            subPath: GOCACHE
        workingDir: /go/src/github.com/golang/example
        command: [ sh, -xuce ]
        args:
          - |
            go mod download -x

    - name: build
      container:
        image: golang:1.27.3
        volumeMounts:
          - mountPath: /go/src/github.com/golang/example
            name: work
            subPath: src
          - mountPath: /go/pkg/mod
            name: work
            subPath: GOMODCACHE
          - mountPath: /root/.cache/go-build
            name: work
            subPath: GOCACHE
        workingDir: /go/src/github.com/golang/example
        command: [ sh, -xuce ]
        args:
          - |
            go build ./...

    - name: test
      container:
        image: golang:1.27.3
        volumeMounts:
          - mountPath: /go/src/github.com/golang/example
            name: work
            subPath: src
          - mountPath: /go/pkg/mod
            name: work
            subPath: GOMODCACHE
          - mountPath: /root/.cache/go-build
            name: work
            subPath: GOCACHE
        workingDir: /go/src/github.com/golang/example
        command: [ sh, -euxc ]
        args:
          - |
            go install github.com/jstemmer/go-junit-report@latest
            go install github.com/alexec/junit2html@v0.0.2

            # Write the report off the work volume: artifacts on a volume mount aren't saved.
            trap 'cat test.out; go-junit-report < test.out | junit2html > /tmp/test-report.html' EXIT

            go test -v ./... > test.out 2>&1
      outputs:
        artifacts:
          - name: test-report
            path: /tmp/test-report.html
            archive:
              none: { }
            s3:
              key: "{{workflow.parameters.branch}}/test-report.html"
