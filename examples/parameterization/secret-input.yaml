# Local synthetic runtime input demo.
apiVersion: parameters.workflows.example.io/v1alpha1
kind: ParameterTemplate
metadata:
  name: secret-input-demo
  namespace: argo-parameterization-lab
spec:
  dialect: http://json-schema.org/draft-07/schema#
  schema:
    type: object
    properties:
      credential:
        type: object
        properties:
          secretRef:
            type: object
            properties:
              name:
                type: string
              key:
                type: string
            required:
            - name
            - key
            additionalProperties: false
        required:
        - secretRef
        additionalProperties: false
      note:
        type: string
    required:
    - credential
    additionalProperties: false
  sensitivePaths:
  - /credential
  secretSchemas:
    /credential:
      type: string
      minLength: 8
---
apiVersion: parameters.workflows.example.io/v1alpha1
kind: WorkflowForm
metadata:
  name: secret-input-demo
  namespace: argo-parameterization-lab
spec:
  parameterTemplate: secret-input-demo
  layout:
  - id: authorization
    kind: tab
    label: Operation authorization
  fields:
  - path: /credential
    widget: secret
    group: authorization
  - path: /note
    group: authorization
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: secret-input-demo
  namespace: argo-parameterization-lab
  labels:
    workflows.argoproj.io/controller-instanceid: parameterization-lab
spec:
  serviceAccountName: workflow-executor
  entrypoint: main
  templates:
  - name: main
    dag:
      tasks:
      - name: authorize
        template: authorize
      - name: consume
        dependencies:
        - authorize
        template: consume
        arguments:
          parameters:
          - name: credential
            value: '{{tasks.authorize.outputs.parameters.credential}}'
  - name: authorize
    suspend: {}
    outputs:
      parameters:
      - name: credential
        valueFrom:
          supplied: {}
      - name: note
        valueFrom:
          supplied: {}
  - name: consume
    inputs:
      parameters:
      - name: credential
    container:
      image: python:3.12-alpine
      command:
      - python
      - -c
      args:
      - import os; assert len(os.environ["TOKEN"]) >= 8; print("runtime-credential-consumed")
      env:
      - name: TOKEN
        valueFrom:
          secretKeyRef:
            name: '{{=jsonpath(inputs.parameters.credential, ''$.secretRef.name'')}}'
            key: '{{=jsonpath(inputs.parameters.credential, ''$.secretRef.key'')}}'
---
apiVersion: parameters.workflows.example.io/v1alpha1
kind: WorkflowParameterBinding
metadata:
  name: secret-input-demo
  namespace: argo-parameterization-lab
spec:
  workflowTemplate: secret-input-demo
  parameterTemplate: empty-v1
  mappings: []
  inputs:
  - template: authorize
    parameterTemplate: secret-input-demo
    form: secret-input-demo
    mappings:
    - path: /credential
      parameter: credential
      encoding: secret-reference-json
    - path: /note
      parameter: note
      encoding: string
