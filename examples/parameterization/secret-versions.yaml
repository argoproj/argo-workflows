# Isolated local synthetic acceptance demo. No business services or real credentials.
apiVersion: parameters.workflows.example.io/v1alpha1
kind: ParameterTemplate
metadata:
  name: secret-versions-demo
  namespace: argo-parameterization-lab
spec:
  dialect: http://json-schema.org/draft-07/schema#
  schema:
    type: object
    properties:
      credential:
        type: object
        properties:
          secretRef:
            type: object
            properties:
              name:
                type: string
              key:
                type: string
            required:
            - name
            - key
            additionalProperties: false
          latestSecretRef:
            type: object
            properties:
              configMap:
                type: string
              key:
                type: string
            required:
            - configMap
            - key
            additionalProperties: false
        oneOf:
        - required:
          - secretRef
        - required:
          - latestSecretRef
        additionalProperties: false
    required:
    - credential
    additionalProperties: false
  sensitivePaths:
  - /credential
  secretSchemas:
    /credential:
      type: string
      minLength: 5
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: secret-versions-demo
  namespace: argo-parameterization-lab
  labels:
    workflows.argoproj.io/controller-instanceid: parameterization-lab
spec:
  entrypoint: main
  serviceAccountName: workflow-executor
  arguments:
    parameters:
    - name: credential
  templates:
  - name: main
    dag:
      tasks:
      - name: approve
        template: approve
      - name: consume
        dependencies:
        - approve
        template: consume
        arguments:
          parameters:
          - name: credential
            value: '{{workflow.parameters.credential}}'
  - name: approve
    suspend: {}
  - name: consume
    inputs:
      parameters:
      - name: credential
    metadata:
      annotations:
        parameters.workflows.example.io/retry-safe: idempotent
        parameters.workflows.example.io/result-reuse: same-inputs
    container:
      image: alpine:3.22
      command:
      - sh
      - -ec
      args:
      - test "${#TOKEN}" -gt 25; echo credential-consumed
      env:
      - name: TOKEN
        valueFrom:
          secretKeyRef:
            name: '{{=jsonpath(inputs.parameters.credential, ''$.secretRef.name'')}}'
            key: '{{=jsonpath(inputs.parameters.credential, ''$.secretRef.key'')}}'
---
apiVersion: parameters.workflows.example.io/v1alpha1
kind: WorkflowParameterBinding
metadata:
  name: secret-versions-demo
  namespace: argo-parameterization-lab
spec:
  workflowTemplate: secret-versions-demo
  parameterTemplate: secret-versions-demo
  mappings:
  - path: /credential
    parameter: credential
    encoding: secret-reference-json
---
apiVersion: v1
kind: Secret
metadata:
  name: secret-versions-demo-v1
  namespace: argo-parameterization-lab
immutable: true
stringData:
  token: synthetic-short
---
apiVersion: v1
kind: Secret
metadata:
  name: secret-versions-demo-v2
  namespace: argo-parameterization-lab
immutable: true
stringData:
  token: synthetic-long-local-demo-credential
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: secret-versions-demo
  namespace: argo-parameterization-lab
data:
  current: '{"name":"secret-versions-demo-v1","key":"token"}'
