# Example adapter API, not part of the Argo parameterization API group.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: resultqueries.results.example.io
spec:
  group: results.example.io
  scope: Namespaced
  names:
    plural: resultqueries
    singular: resultquery
    kind: ResultQuery
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [operation, target]
            properties:
              operation:
                type: string
                enum: [report.read]
              target:
                type: string
                minLength: 1
                maxLength: 128
          status:
            type: object
            properties:
              ready:
                type: boolean
              observedAt:
                type: string
              document:
                type: object
                x-kubernetes-preserve-unknown-fields: true
