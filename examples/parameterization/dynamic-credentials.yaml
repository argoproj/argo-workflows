# Synthetic local Vault Agent example; install the backend with dynamic_leases_e2e.py --install-demo.
apiVersion: parameters.workflows.example.io/v1alpha1
kind: ParameterTemplate
metadata:
  name: dynamic-credential-demo
  namespace: argo-parameterization-lab
spec:
  dialect: http://json-schema.org/draft-07/schema#
  schema:
    type: object
    properties:
      credential:
        type: object
        properties:
          secretRef:
            type: object
            properties:
              name:
                type: string
              key:
                type: string
            required:
            - name
            - key
            additionalProperties: false
          latestSecretRef:
            type: object
            properties:
              configMap:
                type: string
              key:
                type: string
            required:
            - configMap
            - key
            additionalProperties: false
        oneOf:
        - required:
          - secretRef
        - required:
          - latestSecretRef
        additionalProperties: false
    required:
    - credential
    additionalProperties: false
  sensitivePaths:
  - /credential
  secretSchemas:
    /credential:
      type: string
      minLength: 5
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: dynamic-credential-demo
  namespace: argo-parameterization-lab
  labels:
    workflows.argoproj.io/controller-instanceid: parameterization-lab
spec:
  entrypoint: main
  serviceAccountName: workflow-executor
  arguments:
    parameters:
    - name: credential
  templates:
  - name: main
    dag:
      tasks:
      - name: approve
        template: approve
      - name: consume
        dependencies:
        - approve
        template: consume
        arguments:
          parameters:
          - name: credential
            value: '{{workflow.parameters.credential}}'
  - name: approve
    suspend: {}
  - name: consume
    suspend: {}
  volumes:
  - name: scratch
    emptyDir:
      medium: Memory
---
apiVersion: parameters.workflows.example.io/v1alpha1
kind: WorkflowParameterBinding
metadata:
  name: dynamic-credential-demo
  namespace: argo-parameterization-lab
spec:
  workflowTemplate: dynamic-credential-demo
  parameterTemplate: dynamic-credential-demo
  mappings:
  - path: /credential
    parameter: credential
    encoding: secret-reference-json
  actionBinding: dynamic-credential-demo
---
apiVersion: parameters.workflows.example.io/v1alpha1
kind: ActionDefinition
metadata:
  name: dynamic-credential-demo
  namespace: argo-parameterization-lab
spec:
  inputSchema:
    type: object
    properties:
      credential:
        type: object
        properties:
          secretRef:
            type: object
            properties:
              name:
                type: string
              key:
                type: string
            required:
            - name
            - key
            additionalProperties: false
          latestSecretRef:
            type: object
            properties:
              configMap:
                type: string
              key:
                type: string
            required:
            - configMap
            - key
            additionalProperties: false
        oneOf:
        - required:
          - secretRef
        - required:
          - latestSecretRef
        additionalProperties: false
    required:
    - credential
    additionalProperties: false
  outputSchema:
    type: object
    properties:
      leaseId:
        type: string
        minLength: 1
    required:
    - leaseId
    additionalProperties: false
  template:
    name: consume
    inputs:
      parameters:
      - name: credential
    metadata:
      annotations:
        parameters.workflows.example.io/retry-safe: idempotent
        parameters.workflows.example.io/result-reuse: same-inputs
        parameters.workflows.example.io/dynamic-credential-policy: vault-agent/per-attempt;
          renewable; no-process-restart; ttl-bound-cleanup
    container:
      image: argo-parameterization-vault-task:local-v52
      imagePullPolicy: Never
      command:
      - sh
      - -ec
      args:
      - "umask 077\nprintf %s \"$BOOTSTRAP\" > /scratch/token\nunset BOOTSTRAP\ncat\
        \ > /scratch/agent.hcl <<'CONFIG'\nauto_auth {\n  method \"token_file\" {\
        \ config = { token_file_path = \"/scratch/token\" } }\n}\nvault { address\
        \ = \"http://dynamic-credential-demo:8200\" retry { num_retries = 1 } }\n\
        template_config { exit_on_retry_failure = true }\nenv_template \"PGUSER\"\
        \ {\n  contents = \"[[ with secret \\\"database/creds/demo\\\" ]][[ .Data.username\
        \ ]][[ end ]]\"\n  left_delimiter = \"[[\"\n  right_delimiter = \"]]\"\n \
        \ error_on_missing_key = true\n}\nenv_template \"PGPASSWORD\" {\n  contents\
        \ = \"[[ with secret \\\"database/creds/demo\\\" ]][[ .Data.password ]][[\
        \ end ]]\"\n  left_delimiter = \"[[\"\n  right_delimiter = \"]]\"\n  error_on_missing_key\
        \ = true\n}\nenv_template \"LEASE_ID\" {\n  contents = \"[[ with secret \\\
        \"database/creds/demo\\\" ]][[ .LeaseID ]][[ end ]]\"\n  left_delimiter =\
        \ \"[[\"\n  right_delimiter = \"]]\"\n  error_on_missing_key = true\n}\nexec\
        \ {\n  command = [\"/bin/sh\", \"-ec\", \"printf %s \\\"$LEASE_ID\\\" > /scratch/lease-id;\
        \ unset LEASE_ID; exec /bin/sh /demo/query.sh\"]\n  restart_on_secret_changes\
        \ = \"never\"\n}\nCONFIG\nexec timeout -s TERM 65 vault agent -config=/scratch/agent.hcl\
        \ -log-level=error"
      env:
      - name: BOOTSTRAP
        valueFrom:
          secretKeyRef:
            name: '{{=jsonpath(inputs.parameters.credential, ''$.secretRef.name'')}}'
            key: '{{=jsonpath(inputs.parameters.credential, ''$.secretRef.key'')}}'
      - name: PGHOST
        value: dynamic-credential-demo
      - name: PGDATABASE
        value: postgres
      - name: PGCONNECT_TIMEOUT
        value: '3'
      - name: PGSSLMODE
        value: disable
      volumeMounts:
      - name: scratch
        mountPath: /scratch
    activeDeadlineSeconds: 75
    outputs:
      parameters:
      - name: leaseId
        valueFrom:
          path: /scratch/lease-id
          default: not-issued
---
apiVersion: parameters.workflows.example.io/v1alpha1
kind: WorkflowActionBinding
metadata:
  name: dynamic-credential-demo
  namespace: argo-parameterization-lab
spec:
  workflowTemplate: dynamic-credential-demo
  calls:
  - template: consume
    actionDefinition: dynamic-credential-demo
