# Local synthetic input demo; never enter production credentials.
apiVersion: parameters.workflows.example.io/v1alpha1
kind: ParameterTemplate
metadata:
  name: secret-array-demo
  namespace: argo-parameterization-lab
spec:
  dialect: http://json-schema.org/draft-07/schema#
  schema:
    type: object
    properties:
      accounts:
        type: array
        default:
        - id: alpha
        - id: beta
        minItems: 1
        maxItems: 8
        items:
          type: object
          properties:
            id:
              type: string
              minLength: 1
            credential:
              type: object
              properties:
                secretRef:
                  type: object
                  properties:
                    name:
                      type: string
                    key:
                      type: string
                  required:
                  - name
                  - key
                  additionalProperties: false
              required:
              - secretRef
              additionalProperties: false
          required:
          - id
          - credential
          additionalProperties: false
    required:
    - accounts
    additionalProperties: false
  sensitivePaths:
  - /accounts/*/credential
  secretSchemas:
    /accounts/*/credential:
      type: string
      minLength: 8
  identityRules:
  - path: /accounts
    keyPath: /id
---
apiVersion: parameters.workflows.example.io/v1alpha1
kind: WorkflowForm
metadata:
  name: secret-array-demo
  namespace: argo-parameterization-lab
spec:
  parameterTemplate: secret-array-demo
  fields:
  - path: /accounts
    widget: table
  - path: /accounts/*/credential
    widget: secret
---
apiVersion: parameters.workflows.example.io/v1alpha1
kind: WorkflowParameterBinding
metadata:
  name: secret-array-demo
  namespace: argo-parameterization-lab
spec:
  workflowTemplate: secret-array-demo
  parameterTemplate: secret-array-demo
  form: secret-array-demo
  mappings:
  - path: /accounts
    parameter: accounts
    encoding: secret-reference-json
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: secret-array-demo
  namespace: argo-parameterization-lab
  labels:
    workflows.argoproj.io/controller-instanceid: parameterization-lab
spec:
  serviceAccountName: workflow-executor
  entrypoint: main
  arguments:
    parameters:
    - name: accounts
  templates:
  - name: main
    steps:
    - - name: consume
        template: consume
        withParam: '{{workflow.parameters.accounts}}'
        arguments:
          parameters:
          - name: id
            value: '{{item.id}}'
          - name: credential-name
            value: "{{=jsonpath(item.credential, '$.secretRef.name')}}"
          - name: credential-key
            value: "{{=jsonpath(item.credential, '$.secretRef.key')}}"
  - name: consume
    inputs:
      parameters:
      - name: id
      - name: credential-name
      - name: credential-key
    container:
      image: python:3.12-alpine
      command:
      - python
      - -c
      args:
      - import os; assert len(os.environ["TOKEN"]) >= 8; print("credential-consumed:"+os.environ["ROW"])
      env:
      - name: ROW
        value: '{{inputs.parameters.id}}'
      - name: TOKEN
        valueFrom:
          secretKeyRef:
            name: '{{inputs.parameters.credential-name}}'
            key: '{{inputs.parameters.credential-key}}'
