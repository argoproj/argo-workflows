apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: parallel-
  annotations:
    workflows.argoproj.io/description: |
      This workflow demonstrates running parallel containers within a single pod.
spec:
  entrypoint: main
  templates:
    - name: main
      containerSet:
        containers:
          - name: a
            image: argoproj/argosay:v2
          - name: b
            image: argoproj/argosay:v2
