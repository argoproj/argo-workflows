apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: sequence-
  annotations:
    workflows.argoproj.io/description: |
      This workflow demonstrates running a sequence of containers within a single pod.
spec:
  entrypoint: main
  templates:
    - name: main
      containerSet:
        containers:
          - name: a
            image: argoproj/argosay:v2
          - name: b
            image: argoproj/argosay:v2
            dependencies: ["a"]
          - name: c
            image: argoproj/argosay:v2
            dependencies: ["b"]
