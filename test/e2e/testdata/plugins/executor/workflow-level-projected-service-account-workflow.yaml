apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: workflow-level-projected-sa-
spec:
  serviceAccountName: argo
  entrypoint: main
  executorPlugins:
    - metadata:
        name: use-projected-sa
      spec:
        sidecar:
          automountWorkflowServiceAccountToken: true
          container:
            name: use-projected-sa
            image: python:alpine3.23
            command: [python, -c]
            args:
              - |
                import base64
                import json
                import ssl
                from http.server import BaseHTTPRequestHandler, HTTPServer
                from pathlib import Path
                from urllib.parse import urlencode
                from urllib.request import Request, urlopen

                def check_service_account(args):
                    mount = Path('/var/run/secrets/kubernetes.io/serviceaccount')
                    # JWT token. Structure: header.payload.signature
                    token = (mount / 'token').read_text().strip()
                    payload = token.split('.')[1]
                    namespace = (mount / 'namespace').read_text().strip()
                    expected_account = args['template']['plugin']['useProjectedSA']['serviceAccountName']
                    expected_subject = f'system:serviceaccount:{namespace}:{expected_account}'
                    claims = json.loads(base64.urlsafe_b64decode(payload + '=' * (-len(payload) % 4)))
                    assert claims['sub'] == expected_subject, f"unexpected service account: {claims['sub']}"
                    workflow = args['workflow']['metadata']['name']
                    query = urlencode({'fieldSelector': f'metadata.name={workflow}'})
                    request = Request(
                        f'https://kubernetes.default.svc/apis/argoproj.io/v1alpha1/namespaces/{namespace}/workflowtasksets?{query}',
                        headers={'Authorization': f'Bearer {token}'},
                    )
                    context = ssl.create_default_context(cafile=str(mount / 'ca.crt'))
                    with urlopen(request, context=context, timeout=10) as response:
                        task_sets = json.load(response)
                    assert any(item['metadata']['name'] == workflow for item in task_sets['items']), 'workflow task set not found in the projected namespace'
                    return f'Authenticated as {expected_subject}'

                class Plugin(BaseHTTPRequestHandler):
                    def do_POST(self):
                        if self.path != '/api/v1/template.execute':
                            self.send_error(404)
                            return
                        args = json.loads(self.rfile.read(int(self.headers['Content-Length'])))
                        reply = {}
                        if 'useProjectedSA' in args['template'].get('plugin', {}):
                            try:
                                node = {'phase': 'Succeeded', 'message': check_service_account(args)}
                            except Exception as error:
                                node = {'phase': 'Failed', 'message': f'Projected service account check failed: {error}'}
                            reply = {'node': node}
                        self.send_response(200)
                        self.end_headers()
                        self.wfile.write(json.dumps(reply).encode())

                HTTPServer(('', 4356), Plugin).serve_forever()
            ports:
              - containerPort: 4356
            resources:
              requests:
                cpu: 100m
                memory: 32Mi
              limits:
                cpu: 200m
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
              readOnlyRootFilesystem: true
              runAsNonRoot: true
  templates:
    - name: main
      plugin:
        useProjectedSA:
          serviceAccountName: argo
