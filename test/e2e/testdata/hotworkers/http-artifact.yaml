apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: pool-http-artifact-
spec:
  entrypoint: main
  templates:
    - name: main
      pool:
        name: e2e-http
        retentionSeconds: 300
      inputs:
        artifacts:
          - name: my-art
            path: /my-artifact
            http:
              url: http://httpbin:9100/basic-auth/admin/password
              auth:
                basicAuth:
                  usernameSecret:
                    name: my-httpbin-cred
                    key: user
                  passwordSecret:
                    name: my-httpbin-cred
                    key: pass
      container:
        image: argoproj/argosay:v2
        command: [cat, /my-artifact]
