# A task whose pod was killed by the workflow deadline before it ran fails with no outputs.
# continueOn lets its dependants run; the next task then references an output that will
# never exist. The workflow must fail rather than requeue forever.
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: dag-failed-output-ref-
spec:
  entrypoint: main
  # Short deadline so the producer is still Pending when it fires. A pod killed before its wait
  # container reports has no outputs at all, not even the declared default.
  activeDeadlineSeconds: 10
  templates:
  - name: main
    dag:
      tasks:
      - name: producer
        template: producer
        continueOn:
          failed: true
          error: true
      - name: consumer
        template: print
        dependencies: [producer]
        when: '{{tasks.producer.status}} == Succeeded && "{{tasks.producer.outputs.parameters.flag}}" == "true"'
        arguments:
          parameters:
          - name: msg
            value: "producer said {{tasks.producer.outputs.parameters.flag}}"
  - name: producer
    retryStrategy:
      limit: "1"
    outputs:
      parameters:
      - name: flag
        valueFrom:
          path: /tmp/flag
          default: "false"
    # Unschedulable on purpose so the pod never starts.
    nodeSelector:
      does-not-exist: "true"
    container:
      image: argoproj/argosay:v2
      args: [echo, "true", /tmp/flag]
  - name: print
    inputs:
      parameters:
      - name: msg
    container:
      image: argoproj/argosay:v2
      args: [echo, "{{inputs.parameters.msg}}"]
