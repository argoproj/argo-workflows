apiVersion: argoproj.io/v1alpha1
kind: Workflow
spec:
  entrypoint: root
  templates:
    - name: template
      inputs:
        parameters:
          - name: data
      container:
        name: main
        image: alpine
    - name: root
      dag:
        tasks:
          - name: task
            template: template
            arguments:
              parameters:
                - name: data
                  valueFrom:
                    path: /tmp/my-path
