apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: dag-cycle-
spec:
  entrypoint: entry
  templates:
  - name: echo
    container:
      image: alpine:3.23
      command: [echo, hello]
  - name: entry
    dag:
      tasks:
      - name: A
        template: echo
      - name: B
        depends: A.AnySucceeded
        template: echo
