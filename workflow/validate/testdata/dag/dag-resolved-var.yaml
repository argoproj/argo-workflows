apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: dag-cycle-
spec:
  entrypoint: unresolved
  templates:
  - name: echo
    inputs:
      parameters:
      - name: message
      - name: startedat
      - name: finishedat
      - name: id
      - name: hostnodename
    container:
      image: alpine:3.23
      command: [echo, "{{inputs.parameters.message}}"]
    outputs:
      parameters:
      - name: hosts
        valueFrom:
          path: /etc/hosts
  - name: unresolved
    dag:
      tasks:
      - name: A
        template: echo
        arguments:
          parameters:
          - name: message
            value: val
          - name: startedat
            value: "test"
          - name: finishedat
            value: "test"
          - name: id
            value: "1"
          - name: hostnodename
            value: "test"
      - name: B
        dependencies: [A]
        template: echo
        arguments:
          parameters:
          - name: message
            value: "{{tasks.A.outputs.parameters.hosts}}"
          - name: startedat
            value: "{{tasks.A.startedAt}}"
          - name: finishedat
            value: "{{tasks.A.finishedAt}}"
          - name: id
            value: "{{tasks.A.id}}"
          - name: hostnodename
            value: "{{tasks.A.hostNodeName}}"
      - name: C
        dependencies: [B]
        template: echo
        arguments:
          parameters:
          - name: message
            value: "{{tasks.A.outputs.parameters.hosts}}"
          - name: startedat
            value: "{{tasks.A.startedAt}}"
          - name: finishedat
            value: "{{tasks.A.finishedAt}}"
          - name: id
            value: "{{tasks.A.id}}"
          - name: hostnodename
            value: "{{tasks.A.hostNodeName}}"
