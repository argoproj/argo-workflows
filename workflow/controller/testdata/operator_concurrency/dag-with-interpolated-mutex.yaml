apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
 name: dag-mutex
 namespace: default
spec:
 entrypoint: diamond
 templates:
 - name: diamond
   dag:
     tasks:
     - name: A
       template: mutex
       arguments:
         parameters:
         - name: message
           value: foo/bar

     - name: B
       depends: A
       template: mutex
       arguments:
         parameters:
         - name: message
           value: foo/bar

 - name: mutex
   synchronization:
     mutexes:
       - name: '{{=sprig.replace("/", "-", inputs.parameters.message)}}'
   inputs:
     parameters:
     - name: message
   container:
     image: alpine:3.23
     command: [sh, -c, "echo {{inputs.parameters.message}}"]
