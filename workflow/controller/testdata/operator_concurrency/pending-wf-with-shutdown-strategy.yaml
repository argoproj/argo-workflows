apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: synchronization-wf-level
  namespace: default
spec:
  entrypoint: whalesay
  onExit: whalesay
  synchronization:
    mutexes:
      - name:  test
  templates:
    - name: whalesay
      container:
        image: docker/whalesay:latest
        command: [sh, -c]
        args: ["sleep 99999"]
