apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: tmpl-mutex-dag
  namespace: default
spec:
  entrypoint: main
  templates:
    - name: main
      dag:
        tasks:
          - name: locked
            template: whalesay
    - name: whalesay
      synchronization:
        mutexes:
          - name: tmpl-shutdown-test
      container:
        image: docker/whalesay:latest
        command: [sh, -c]
        args: ["sleep 99999"]
