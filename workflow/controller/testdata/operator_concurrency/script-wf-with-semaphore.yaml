apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: script-wf
  namespace: default
spec:
  entrypoint: scriptTmpl
  templates:
  - name: scriptTmpl
    synchronization:
      semaphores:
        - configMapKeyRef:
            key: template
            name: my-config
    script:
      image: python:alpine3.23
      command: ["python"]
      # fail with a 66% probability
      source: |
        import random;
        import sys;
        exit_code = random.choice([0, 1, 1]);
        sys.exit(exit_code)
