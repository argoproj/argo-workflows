apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: hello-world-with-container-set
spec:
  entrypoint: whalesay
  templates:
  - name: whalesay
    containerSet:
      containers:
        - name: a
          image: docker/whalesay:latest
          command: [cowsay]
          args: ["hello world"]
        - name: b
          image: docker/whalesay:latest
          command: [cowsay]
          args: ["hello world"]
