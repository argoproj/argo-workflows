
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: scripts-python
spec:
  entrypoint: python-script-example
  templates:
  - name: python-script-example
    steps:
    - - name: print-hello-world
        template: print-hello-world
        arguments:
          parameters:
          - name: message
            value: 
  - name: print-hello-world
    inputs:
      parameters:
        - name: message
    script:
      command:
      - python
      image: python:alpine3.23
      source: |
        print("{{inputs.parameters.message}}")