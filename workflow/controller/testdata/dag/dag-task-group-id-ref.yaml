apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: dag-taskgroup-id-ref
spec:
  entrypoint: main
  templates:
  - name: main
    dag:
      tasks:
      - name: generate
        template: gen-list
      - name: fanout
        dependencies: [generate]
        template: echo
        arguments:
          parameters:
          - name: msg
            value: '{{item}}'
        withParam: '{{tasks.generate.outputs.result}}'
      - name: use-id
        dependencies: [fanout]
        template: echo
        arguments:
          parameters:
          - name: msg
            value: '{{tasks.fanout.id}}'
  - name: gen-list
    script:
      image: python:alpine3.23
      command: [python]
      source: |
        import json, sys
        json.dump([0, 1], sys.stdout)
  - name: echo
    inputs:
      parameters:
      - name: msg
    container:
      image: alpine:3.23
      command: [echo, '{{inputs.parameters.msg}}']
status:
