apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: dag-skipped-input-default-suppressed
spec:
  entrypoint: main
  templates:
  - name: main
    dag:
      tasks:
      - name: producer
        template: produce
        when: "false"
      - name: consumer
        template: consume
        depends: "producer.Succeeded || producer.Skipped"
        arguments:
          parameters:
          - name: in
            value: "{{tasks.producer.outputs.parameters.msg}}"
  - name: produce
    outputs:
      parameters:
      - name: msg
        valueFrom:
          path: /tmp/out.txt   # NOTE: no valueFrom.default here
    container:
      image: alpine:3.23
      command: [sh, -c]
      args: ["echo hello > /tmp/out.txt"]
  - name: consume
    inputs:
      parameters:
      - name: in
        default: "FALLBACK-FROM-INPUT"
    container:
      image: alpine:3.23
      command: [echo, "{{inputs.parameters.in}}"]
