apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: dag-onexit-shutdown
spec:
  entrypoint: main-dag
  onExit: exit-dag
  shutdown: Stop
  templates:
  - name: main-dag
    dag:
      tasks:
      - name: main-task
        template: echo
  - name: exit-dag
    dag:
      tasks:
      - name: on-exit-handler
        template: echo
  - name: echo
    container:
      image: alpine:latest
      command: [echo, hello]
