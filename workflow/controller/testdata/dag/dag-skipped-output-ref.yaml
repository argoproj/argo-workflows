apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: dag-skipped-output-ref
spec:
  entrypoint: main
  arguments:
    parameters:
      - name: run-stage-b
        value: "false"
  templates:
    - name: main
      inputs:
        parameters:
          - name: run-stage-b
      dag:
        tasks:
          - name: stage-a
            template: stage-a
          - name: stage-b
            template: stage-b
            when: "\"{{inputs.parameters.run-stage-b}}\" == \"true\""
          - name: stage-c
            template: stage-c
            depends: "stage-a && (stage-b || stage-b.Skipped)"
            arguments:
              parameters:
                - name: message-from-a
                  value: "{{tasks.stage-a.outputs.parameters.output-message}}"
                - name: message-from-b
                  value: "{{tasks.stage-b.outputs.parameters.output-message}}"
    - name: stage-a
      outputs:
        parameters:
          - name: output-message
            valueFrom:
              path: /tmp/output.txt
      container:
        image: alpine:3.23
        command: [sh, -c]
        args: ["echo 'hello from stage A' > /tmp/output.txt"]
    - name: stage-b
      outputs:
        parameters:
          - name: output-message
            valueFrom:
              path: /tmp/output.txt
      container:
        image: alpine:3.23
        command: [sh, -c]
        args: ["echo 'hello from stage B' > /tmp/output.txt"]
    - name: stage-c
      inputs:
        parameters:
          - name: message-from-a
          - name: message-from-b
      container:
        image: alpine:3.23
        command: [echo]
        args: ["{{inputs.parameters.message-from-a}}", "{{inputs.parameters.message-from-b}}"]
status:
  phase: Running
  startedAt: "2024-01-01T00:00:00Z"
  nodes:
    dag-skipped-output-ref:
      id: dag-skipped-output-ref
      name: dag-skipped-output-ref
      displayName: dag-skipped-output-ref
      type: DAG
      templateName: main
      templateScope: local/dag-skipped-output-ref
      phase: Running
      startedAt: "2024-01-01T00:00:00Z"
      children:
        - dag-skipped-output-ref-1381367026
        - dag-skipped-output-ref-1364589407
      outboundNodes:
        - dag-skipped-output-ref-1347811788
    dag-skipped-output-ref-1381367026:
      id: dag-skipped-output-ref-1381367026
