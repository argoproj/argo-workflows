apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: dag-skipped-ref-dynamic-template
  namespace: default
spec:
  entrypoint: main
  templates:
  - name: main
    dag:
      tasks:
      - name: producer
        template: produce
        when: "false"
      - name: consumer
        templateRef:
          name: "{{item.wftmpl}}"
          template: "{{item.tmpl}}"
        withItems:
        - { wftmpl: "skipped-ref-consume", tmpl: "consume" }
        depends: "producer.Succeeded || producer.Skipped"
        arguments:
          parameters:
          - name: in
            value: "{{tasks.producer.outputs.parameters.msg}}"
  - name: produce
    outputs:
      parameters:
      - name: msg
        valueFrom:
          path: /tmp/out.txt
    container:
      image: alpine:3.23
      command: [sh, -c]
      args: ["echo hello > /tmp/out.txt"]
