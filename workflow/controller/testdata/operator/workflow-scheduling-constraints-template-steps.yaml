apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: benchmarks-steps
  namespace: argo
spec:
  entrypoint: main
  templates:
  - name: main
    steps:
    - - name: benchmark1
        arguments:
          parameters:
          - name: msg
            value: 'hello'
        template: benchmark
      - name: benchmark2
        arguments:
          parameters:
          - name: msg
            value: 'hello'
        template: benchmark
    nodeSelector:
      pool: workflows
    tolerations:
    - key: pool
      operator: Equal
      value: workflows
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node_group
                  operator: In
                  values:
                    - argo-workflow
  - inputs:
      parameters:
      - name: msg
    name: benchmark
    script:
      command:
      - python
      image: python:latest
      source: |
        print("{{inputs.parameters.msg}}")
