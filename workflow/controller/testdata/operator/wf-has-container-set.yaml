apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: wf-has-containerSet
spec:
  entrypoint: init
  templates:
    - name: init
      dag:
        tasks:
          - name: A
            template: run
    - name: run
      containerSet:
        containers:
          - name: main
            image: alpine:3.23
            command:
              - /bin/sh
            args:
              - '-c'
              - sleep 9000
          - name: main2
            image: alpine:3.23
            command:
              - /bin/sh
            args:
              - '-c'
              - sleep 9000
