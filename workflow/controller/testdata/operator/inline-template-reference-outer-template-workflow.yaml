apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: inline-composite-retry-
spec:
  entrypoint: main
  templates:
    - name: main
      steps:
      - - name: step1
          inline:
            steps:
            - - name: fail
                template: fail
    - name: fail
      container:
        image: alpine:latest
        command: [sh, -c]
        args: ["exit 1"]
