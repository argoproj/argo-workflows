apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: memoized-bug-
  namespace: default
spec:
  entrypoint: main
  templates:
  - name: main
    steps:
    - - name: hello-dag
        template: memoized
    - - name: whatever
        template: hello

  - name: memoized
    outputs:
      parameters:
      - name: msg
        valueFrom:
          parameter: "{{dag.hello-dag.outputs.result}}"
    dag:
      tasks:
      - name: hello-dag
        template: hello
    memoize:
      key: "memoized-bug-dag-0"
      cache:
        configMap:
          name: my-config

  - name: hello
    container:
      image: alpine:3.23
      command: [sh, -c]
      args: ["echo Hello"]
