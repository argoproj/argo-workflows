apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: daemon-container-set
spec:
  entrypoint: main
  templates:
  - name: main
    daemon: true
    containerSet:
      containers:
      - name: step-1
        image: alpine
        command: [sh, -c, sleep 999999]
      - name: step-2
        image: alpine
        command: [sh, -c, sleep 999999]
