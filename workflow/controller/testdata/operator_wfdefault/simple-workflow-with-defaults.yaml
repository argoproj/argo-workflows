apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata: 
  annotations: 
    testAnnotation: test
  generateName: hello-world-
  labels: 
    testLabel: test
    workflows.argoproj.io/archive-strategy: "false"
spec: 
  activeDeadlineSeconds: 7200
  arguments:
    parameters: 
      - 
        name: message
        value: "hello world"
  entrypoint: whalesay
  onExit: whalesay-exit
  serviceAccountName: default
  templates: 
    - 
      container: 
        args: 
          - "hello world"
        command: 
          - cowsay
        image: "docker/whalesay:latest"
      name: whalesay
    - 
      container: 
        args: 
          - "hello from the default exit handler"
        command: 
          - cowsay
        image: docker/whalesay
      name: whalesay-exit
  ttlStrategy: 
    secondsAfterCompletion: 60
  volumes: 
    - 
      name: test
      secret: 
        secretName: test
