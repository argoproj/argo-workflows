apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: steps-exit-hook-failure
spec:
  entrypoint: main
  templates:
  - name: main
    steps:
    - - name: step-a
        hooks:
          exit:
            template: exit-handler
        template: whalesay
  - name: whalesay
    container:
      image: docker/whalesay
      command: [cowsay]
  - name: exit-handler
    container:
      image: docker/whalesay
      command: [cowsay]
      args: ["exiting"]
