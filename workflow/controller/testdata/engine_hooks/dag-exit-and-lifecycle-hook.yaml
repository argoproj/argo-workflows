apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: dag-exit-and-lifecycle
spec:
  entrypoint: main
  templates:
  - name: main
    dag:
      tasks:
      - name: task-a
        hooks:
          running:
            expression: tasks['task-a'].status == "Running"
            template: hook-handler
          exit:
            template: exit-handler
        template: whalesay
  - name: whalesay
    container:
      image: docker/whalesay
      command: [cowsay]
  - name: hook-handler
    container:
      image: docker/whalesay
      command: [cowsay]
      args: ["hook"]
  - name: exit-handler
    container:
      image: docker/whalesay
      command: [cowsay]
      args: ["exit"]
