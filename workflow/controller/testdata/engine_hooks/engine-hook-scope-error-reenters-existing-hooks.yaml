apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: scope-err
  namespace: default
spec:
  entrypoint: main
  templates:
  - name: main
    dag:
      tasks:
      - {name: g, template: echo, withItems: [one]}
      - name: a
        depends: g
        template: echo
        hooks:
          exit:
            template: wait
  - name: echo
    container:
      image: busybox
      command: [echo]
  - name: wait
    suspend: {duration: "1s"}
