apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: steps-lifecycle-running
spec:
  entrypoint: main
  templates:
  - name: main
    steps:
    - - name: step-a
        hooks:
          running:
            expression: steps['step-a'].status == "Running"
            template: hook-handler
        template: whalesay
  - name: whalesay
    container:
      image: docker/whalesay
      command: [cowsay]
  - name: hook-handler
    container:
      image: docker/whalesay
      command: [cowsay]
      args: ["hook fired"]
