apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: dag-seq-exit
spec:
  entrypoint: main
  templates:
  - name: main
    dag:
      tasks:
      - name: task-a
        hooks:
          exit:
            template: exit-handler
        template: whalesay
      - name: task-b
        dependencies: [task-a]
        hooks:
          exit:
            template: exit-handler
        template: whalesay
  - name: whalesay
    container:
      image: docker/whalesay
      command: [cowsay]
  - name: exit-handler
    container:
      image: docker/whalesay
      command: [cowsay]
      args: ["exiting"]
