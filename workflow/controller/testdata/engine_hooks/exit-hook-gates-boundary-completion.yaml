apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata: {name: t, namespace: argo}
spec:
  entrypoint: main
  templates:
  - name: main
    dag:
      tasks:
      - name: A
        template: failing
        hooks:
          exit: {template: slow}
  - name: failing
    container: {image: alpine, command: [false]}
  - name: slow
    container: {image: alpine, command: [sleep, "9999"]}
