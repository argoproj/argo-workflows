apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: steps-cascade-test
spec:
  entrypoint: main
  templates:
  - name: main
    steps:
    - - name: step-a
        template: echo
        when: "false"
    - - name: step-b
        template: echo
        when: "false"
    - - name: step-c
        template: echo
  - name: echo
    container:
      image: alpine:3.23
      command: [echo, hello]
