apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: steps-when-skip-no-requeue-
spec:
  entrypoint: main
  templates:
  - name: main
    steps:
    - - name: A
        template: script-echo
        when: "false"
    - - name: B
        when: "{{steps.A.status}} == Succeeded"
        template: echo-with-param
        arguments:
          parameters:
          - name: msg
            value: "{{steps.A.outputs.result}}"
  - name: script-echo
    script:
      image: alpine:3.23
      command: [sh]
      source: |
        echo hello
  - name: echo-with-param
    inputs:
      parameters:
      - name: msg
    container:
      image: alpine:3.23
      command: [echo, "{{inputs.parameters.msg}}"]
