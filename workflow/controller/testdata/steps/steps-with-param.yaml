apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: steps-with-params-
spec:
  entrypoint: main
  templates:
  - name: main
    steps:
    - - name: use-with-param
        template: whalesay
        arguments:
          parameters:
          - name: message
            value: "{{item}}"
        withParam: "[1234, \"foo\\tbar\", true, []]"
