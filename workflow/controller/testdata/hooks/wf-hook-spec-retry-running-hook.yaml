apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: wf-hook-spec-retry-running-hook
  namespace: argo
spec:
  entrypoint: main
  retryStrategy:
    limit: 1
  hooks:
    running:
      expression: workflow.status == "Running"
      template: hook
  templates:
    - name: main
      container:
        image: argoproj/argosay:v2
    - name: hook
      container:
        image: argoproj/argosay:v2
