apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: steps-skipped-ref-exit-hook
spec:
  entrypoint: main
  templates:
  - name: main
    steps:
    - - name: producer
        template: produce
        when: "false"
    - - name: work
        template: simple
        hooks:
          exit:
            template: consume
            arguments:
              parameters:
              - name: in
                value: "{{steps.producer.outputs.parameters.msg}}"
              - name: in2
                value: "{{= steps.producer.outputs.parameters.msg ?? 'hook-fallback'}}"
  - name: produce
    outputs:
      parameters:
      - name: msg
        valueFrom:
          path: /tmp/out.txt
    container:
      image: alpine:3.23
      command: [sh, -c]
      args: ["echo hello > /tmp/out.txt"]
  - name: simple
    container:
      image: alpine:3.23
      command: [echo, "hello"]
  - name: consume
    inputs:
      parameters:
      - name: in
        default: "FALLBACK"
      - name: in2
    container:
      image: alpine:3.23
      command: [echo, "{{inputs.parameters.in}} {{inputs.parameters.in2}}"]
