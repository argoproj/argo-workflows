apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: step-hook-retry-running-hook
  namespace: argo
spec:
  entrypoint: main
  retryStrategy:
    limit: 1
  templates:
    - name: main
      steps:
        - - name: step
            template: run
            hooks:
              running:
                expression: steps.step.status == "Running"
                template: hook
    - name: run
      container:
        image: argoproj/argosay:v2
    - name: hook
      container:
        image: argoproj/argosay:v2
