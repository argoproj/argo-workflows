apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: hook-failures
  namespace: argo
spec:
  entrypoint: main
  templates:
    - name: main
      steps:
        - - name: step-1
            template: message
            hooks:
              foo:
                template: message
    - name: message
      script:
        image: alpine:3.23
        command: [sh]
        source: |
          echo Hi
