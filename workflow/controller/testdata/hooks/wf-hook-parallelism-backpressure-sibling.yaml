apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: running-hook-parallelism-sibling
  namespace: default
spec:
  parallelism: 1
  entrypoint: main
  hooks:
    first:
      expression: workflow.status == "Running"
      template: notify
    second:
      expression: workflow.status == "Running"
      templateRef:
        name: hook-parallelism-templates
        template: notify
  templates:
    - name: main
      steps:
        - - name: work
            template: work
    - name: work
      container:
        image: argoproj/argosay:v2
        command: [sh, -c]
        args: ["echo work"]
    - name: notify
      container:
        image: argoproj/argosay:v2
        command: [sh, -c]
        args: ["echo running-notify"]
